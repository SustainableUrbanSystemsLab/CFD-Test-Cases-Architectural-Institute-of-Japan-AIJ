# Verify the generated API, then build the Jekyll site under docs/ (which carries the static API under
# docs/api/) and deploy it to GitHub Pages. Pages must be set to "GitHub Actions" as its source
# (Settings -> Pages -> Source), which `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow` also does.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API is generated and committed. This job rebuilds it from the sources and fails if the result differs
  # from what is committed by a single byte, or if any document breaks its schema, an index hash or a link.
  # Nothing deploys unless it passes.
  verify-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify the committed API as it is
        run: python scripts/build_api.py --check
      - name: Rebuild and compare with what is committed
        run: |
          python scripts/build_api.py
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ differs from a fresh build of scripts/build_api.py. Run it and commit the result."
            git status --porcelain -- docs
            git diff --stat -- docs
            exit 1
          fi

  build:
    needs: verify-api
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
